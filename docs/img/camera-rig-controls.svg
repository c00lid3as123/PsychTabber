<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 358" width="620" height="358" role="img" aria-label="3D camera rig mouse controls"><title>3D camera rig mouse controls</title><rect width="620" height="358" rx="12" fill="#1c1d21"/><text x="20" y="32" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#f1e9ff" text-anchor="start" font-weight="700">3D camera rig: mouse controls</text><rect x="20" y="52" width="190" height="36" rx="6" fill="#383a42" stroke="#4a4d58"/><text x="115" y="75" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">Drag</text><path d="M216 70 h26" stroke="#9047e0" stroke-width="2"/><path d="M242 70 l-6 -4 v8 z" fill="#9047e0"/><text x="252" y="75" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#e6e6ea" text-anchor="start">Aim the camera (left / right / up / down)</text><rect x="20" y="98" width="190" height="36" rx="6" fill="#383a42" stroke="#4a4d58"/><text x="115" y="121" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">Right-drag  or  Shift-drag</text><path d="M216 116 h26" stroke="#9047e0" stroke-width="2"/><path d="M242 116 l-6 -4 v8 z" fill="#9047e0"/><text x="252" y="121" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#e6e6ea" text-anchor="start">Move the camera sideways and up / down</text><rect x="20" y="144" width="190" height="36" rx="6" fill="#383a42" stroke="#4a4d58"/><text x="115" y="167" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">Alt-drag</text><path d="M216 162 h26" stroke="#9047e0" stroke-width="2"/><path d="M242 162 l-6 -4 v8 z" fill="#9047e0"/><text x="252" y="167" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#e6e6ea" text-anchor="start">Roll (twist) the camera</text><rect x="20" y="190" width="190" height="36" rx="6" fill="#383a42" stroke="#4a4d58"/><text x="115" y="213" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">Mouse wheel</text><path d="M216 208 h26" stroke="#9047e0" stroke-width="2"/><path d="M242 208 l-6 -4 v8 z" fill="#9047e0"/><text x="252" y="213" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#e6e6ea" text-anchor="start">Zoom the lens (narrower / wider view)</text><rect x="20" y="236" width="190" height="36" rx="6" fill="#383a42" stroke="#4a4d58"/><text x="115" y="259" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">Ctrl or Shift + wheel</text><path d="M216 254 h26" stroke="#9047e0" stroke-width="2"/><path d="M242 254 l-6 -4 v8 z" fill="#9047e0"/><text x="252" y="259" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#e6e6ea" text-anchor="start">Move the camera closer to / farther from the monitor</text><rect x="20" y="282" width="190" height="36" rx="6" fill="#383a42" stroke="#4a4d58"/><text x="115" y="305" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">Double-click</text><path d="M216 300 h26" stroke="#9047e0" stroke-width="2"/><path d="M242 300 l-6 -4 v8 z" fill="#9047e0"/><text x="252" y="305" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#e6e6ea" text-anchor="start">Reset the camera to the centre</text><text x="20" y="342" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#8b8d98" text-anchor="start">The cyan shape on the monitor shows what the camera sees.</text></svg>