<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 284" width="520" height="284" role="img" aria-label="Camera keyboard controls"><title>Camera keyboard controls</title><rect width="520" height="284" rx="12" fill="#1c1d21"/><text x="20" y="32" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#f1e9ff" text-anchor="start" font-weight="700">Camera keys (press Alt+Shift+C on the page to turn on / off)</text><rect x="150" y="56" width="70" height="56" rx="6" fill="#383a42" stroke="#4a4d58"/><text x="185.0" y="81" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">↑</text><text x="185.0" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#b9bbc6" text-anchor="middle">move up</text><rect x="76" y="118" width="70" height="56" rx="6" fill="#383a42" stroke="#4a4d58"/><text x="111.0" y="143" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">←</text><text x="111.0" y="162" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#b9bbc6" text-anchor="middle">move left</text><rect x="150" y="118" width="70" height="56" rx="6" fill="#383a42" stroke="#4a4d58"/><text x="185.0" y="143" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">↓</text><text x="185.0" y="162" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#b9bbc6" text-anchor="middle">move down</text><rect x="224" y="118" width="70" height="56" rx="6" fill="#383a42" stroke="#4a4d58"/><text x="259.0" y="143" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">→</text><text x="259.0" y="162" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#b9bbc6" text-anchor="middle">move right</text><text x="185" y="200" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#8b8d98" text-anchor="middle">or numpad 8 / 4 / 2 / 6</text><rect x="340" y="56" width="70" height="56" rx="6" fill="#3b2a52" stroke="#4a4d58"/><text x="375.0" y="81" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">+</text><text x="375.0" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#b9bbc6" text-anchor="middle">roll right</text><rect x="414" y="56" width="70" height="56" rx="6" fill="#3b2a52" stroke="#4a4d58"/><text x="449.0" y="81" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">−</text><text x="449.0" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#b9bbc6" text-anchor="middle">roll left</text><rect x="340" y="118" width="70" height="56" rx="6" fill="#3b2a52" stroke="#4a4d58"/><text x="375.0" y="143" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">PgUp</text><text x="375.0" y="162" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#b9bbc6" text-anchor="middle">zoom in</text><rect x="414" y="118" width="70" height="56" rx="6" fill="#3b2a52" stroke="#4a4d58"/><text x="449.0" y="143" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">PgDn</text><text x="449.0" y="162" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#b9bbc6" text-anchor="middle">zoom out</text><rect x="340" y="180" width="70" height="56" rx="6" fill="#2f4a3a" stroke="#4a4d58"/><text x="375.0" y="205" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">R</text><text x="375.0" y="224" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#b9bbc6" text-anchor="middle">reset</text><rect x="414" y="180" width="70" height="56" rx="6" fill="#2f4a3a" stroke="#4a4d58"/><text x="449.0" y="205" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">Shift</text><text x="449.0" y="224" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#b9bbc6" text-anchor="middle">faster</text><text x="20" y="252" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#8b8d98" text-anchor="start">Arrow keys stop scrolling the page while camera keys are on.</text><text x="20" y="268" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#8b8d98">Keys are ignored while you type in a text box.</text></svg>