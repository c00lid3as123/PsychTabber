<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 474" width="460" height="474" role="img" aria-label="Side panel layout"><title>Side panel layout</title><rect width="460" height="474" rx="12" fill="#1c1d21"/><text x="20" y="32" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#f1e9ff" text-anchor="start" font-weight="700">Side panel layout (top to bottom)</text><rect x="20" y="50" width="420" height="44" rx="6" fill="#7b35c4" stroke="#4a4d58"/><text x="36" y="69" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e6e6ea" text-anchor="start" font-weight="700">1. Start on this tab</text><text x="36" y="86" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#b9bbc6" text-anchor="start">big purple button: start / stop</text><rect x="20" y="102" width="420" height="44" rx="6" fill="#2b2d38" stroke="#4a4d58"/><text x="36" y="121" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e6e6ea" text-anchor="start" font-weight="700">2. Presets</text><text x="36" y="138" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#b9bbc6" text-anchor="start">pick, save, delete, export, import</text><rect x="20" y="154" width="420" height="44" rx="6" fill="#2b2d38" stroke="#4a4d58"/><text x="36" y="173" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e6e6ea" text-anchor="start" font-weight="700">3. Master</text><text x="36" y="190" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#b9bbc6" text-anchor="start">filter on, strength, speed, bright-page comp, auto-drift</text><rect x="20" y="206" width="420" height="44" rx="6" fill="#3b2a52" stroke="#4a4d58"/><text x="36" y="225" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e6e6ea" text-anchor="start" font-weight="700">4. Camera feedback</text><text x="36" y="242" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#b9bbc6" text-anchor="start">on/off, 3D camera rig, echoes + look sliders, movement</text><rect x="20" y="258" width="420" height="44" rx="6" fill="#3b2a52" stroke="#4a4d58"/><text x="36" y="277" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e6e6ea" text-anchor="start" font-weight="700">5. See-through cut-outs</text><text x="36" y="294" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#b9bbc6" text-anchor="start">chroma key, colour pick, draw rectangles, undo / clear</text><rect x="20" y="310" width="420" height="44" rx="6" fill="#2b2d38" stroke="#4a4d58"/><text x="36" y="329" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e6e6ea" text-anchor="start" font-weight="700">6. Effects</text><text x="36" y="346" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#b9bbc6" text-anchor="start">tick + slider for each of the 36 effects</text><rect x="20" y="362" width="420" height="44" rx="6" fill="#2b2d38" stroke="#4a4d58"/><text x="36" y="381" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e6e6ea" text-anchor="start" font-weight="700">7. Performance</text><text x="36" y="398" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#b9bbc6" text-anchor="start">render scale, frame rate cap, display mode</text><rect x="20" y="414" width="420" height="44" rx="6" fill="#2b2d38" stroke="#4a4d58"/><text x="36" y="433" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e6e6ea" text-anchor="start" font-weight="700">8. Diagnostics + About</text><text x="36" y="450" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#b9bbc6" text-anchor="start">error details, AI disclosure and disclaimer</text></svg>